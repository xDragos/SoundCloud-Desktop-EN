name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install Tauri CLI
        run: pnpm add -g @tauri-apps/cli
        working-directory: desktop

      - name: Init iOS project
        run: pnpm tauri ios init
        working-directory: desktop

      - name: Build iOS app
        run: pnpm tauri ios build --target aarch64-sim
        working-directory: desktop
        env:
          CI: true

name: Build iOS Simulator
on:
  workflow_dispatch:
  push:
    branches:
      - ios-build
jobs:
  build-ios:
    runs-on: macos-latest
    env:
      CI: true
      npm_config_confirm_modules_purge: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config
      - name: Build Opus for iOS Simulator (arm64)
        run: |
          set -e
          OPUS_VERSION=1.5.2
          curl -L "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz" -o /tmp/opus.tar.gz
          tar xzf /tmp/opus.tar.gz -C /tmp
          cd "/tmp/opus-${OPUS_VERSION}"

          SDK=iphonesimulator
          ARCH=arm64
          MIN_VERSION=13.0
          SDKROOT=$(xcrun --sdk $SDK --show-sdk-path)
          PREFIX="$HOME/opus-ios-sim"

          export CC="$(xcrun --sdk $SDK --find clang)"
          export CFLAGS="-arch $ARCH -isysroot $SDKROOT -mios-simulator-version-min=$MIN_VERSION"
          export LDFLAGS="-arch $ARCH -isysroot $SDKROOT -mios-simulator-version-min=$MIN_VERSION"

          ./configure \
            --host=arm-apple-darwin \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --disable-extra-programs \
            --prefix="$PREFIX"

          make -j"$(sysctl -n hw.ncpu)"
          make install

          mkdir -p ~/.cargo
          {
            echo "[env]"
            echo "OPUS_NO_PKG = \"1\""
            echo "OPUS_LIB_DIR = \"$PREFIX\""
            echo "OPUS_STATIC = \"1\""
          } >> ~/.cargo/config.toml
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Disable Homebrew tap trust check
        run: echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> "$GITHUB_ENV"
      - name: Initialize iOS
        working-directory: desktop
        run: pnpm tauri ios init
      - name: Sync dependencies before Xcode build
        working-directory: desktop
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build iOS Simulator
        working-directory: desktop
        run: pnpm tauri ios build --target aarch64-sim
      - name: Find Simulator App
        working-directory: desktop
        run: |
          find src-tauri/gen/apple -type d -name "*.app" -print
      - name: Package Simulator App
        working-directory: desktop
        run: |
          APP=$(find src-tauri/gen/apple -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Simulator .app not found"
            exit 1
          fi
          echo "Found: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" SoundCloud-iOS-Simulator.zip
      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-iOS-Simulator
          path: desktop/SoundCloud-iOS-Simulator.zip
          if-no-files-found: error

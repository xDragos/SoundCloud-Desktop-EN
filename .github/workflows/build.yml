name: Build Native iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create iOS Swift App Structure
      run: |
        mkdir -p SoundCloudApp/SoundCloudApp
        cat << 'EOF' > SoundCloudApp/SoundCloudApp/ContentView.swift
        import SwiftUI
        import WebKit

        struct WebView: UIViewRepresentable {
            let url: URL
            func makeUIView(context: Context) -> WKWebView {
                let config = WKWebViewConfiguration()
                config.defaultWebpagePreferences.allowsContentJavaScript = true
                return WKWebView(frame: .zero, configuration: config)
            }
            func updateUIView(_ uiView: WKWebView, context: Context) {
                let request = URLRequest(url: url)
                uiView.load(request)
            }
        }

        struct ContentView: View {
            var body: some View {
                WebView(url: URL(string: "https://soundcloud.com")!)
                    .edgesIgnoringSafeArea(.all)
            }
        }
        EOF

        cat << 'EOF' > SoundCloudApp/SoundCloudApp/SoundCloudAppApp.swift
        import SwiftUI

        @main
        struct SoundCloudAppApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF

    - name: Generate Xcode Project with SwiftPM
      run: |
        cd SoundCloudApp
        swift package init --type executable
        
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Xcode Project
      run: |
        cd SoundCloudApp
        xcodebuild -scheme SoundCloudApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO || true

    - name: Create Dummy IPA Structure
      run: |
        mkdir -p Payload/SoundCloud.app
        cp -R SoundCloudApp/SoundCloudApp/* Payload/SoundCloud.app/ 2>/dev/null || true
        zip -r SoundCloud-Web.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SoundCloud-iOS-IPA
        path: SoundCloud-Web.ipa

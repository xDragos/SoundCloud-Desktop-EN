name: Build Capacitor iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/ios

    - name: Initialize Capacitor
      run: |
        npx cap init "SoundCloud" "com.dragos.soundcloud" --web-dir .

    - name: Add iOS platform
      run: |
        npx cap add ios
        npx cap sync ios

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Xcode Project
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace \
                   -scheme App \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

    - name: Create Payload and IPA
      run: |
        mkdir -p Payload
        cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
        zip -r SoundCloud-Capacitor.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SoundCloud-iOS-IPA
        path: SoundCloud-Capacitor.ipa
